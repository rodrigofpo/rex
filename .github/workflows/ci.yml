name: CI - Testes e Validação Multiplataforma

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test:
    name: Testes (${{ matrix.os }} • Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Instalar Dependências do Sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Instalar Pacote e Dependências de Teste
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Teste de Inicialização e CLI
        run: |
          python -m rex --version
          python -m rex --help

      - name: Executar Testes Automatizados
        run: |
          python -m pytest -q

      - name: Validar wheel e pacote fonte
        if: runner.os == 'Linux' && matrix.python-version == '3.11'
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
