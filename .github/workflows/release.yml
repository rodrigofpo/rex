name: CD - Compilação e Release Multiplataforma

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Executável (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: rex-windows-x64.exe
            asset_name: rex-windows-x64.exe
          - os: ubuntu-latest
            artifact_name: rex-linux-x64
            asset_name: rex-linux-x64
          - os: macos-latest
            artifact_name: rex-macos-x64
            asset_name: rex-macos-x64

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar Dependências do Sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Instalar Dependências e PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Compilar Executável Único com PyInstaller (Windows)
        if: runner.os == 'Windows'
        run: |
          pyinstaller --noconfirm --onedir --windowed --name rex-windows-x64 --collect-all rapidocr_onnxruntime --collect-all onnxruntime --collect-all customtkinter rex/cli.py
          tar -czvf rex-windows-x64.tar.gz -C dist rex-windows-x64

      - name: Compilar Executável Único com PyInstaller (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          pyinstaller --noconfirm --onedir --windowed --name ${{ matrix.artifact_name }} --collect-all rapidocr_onnxruntime --collect-all onnxruntime --collect-all customtkinter rex/cli.py
          tar -czvf ${{ matrix.artifact_name }}.tar.gz -C dist ${{ matrix.artifact_name }}

      - name: Upload de Artefato de Compilação
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}-archive
          path: "*.tar.gz"

  publish:
    name: Publicar Release no GitHub
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download de todos os artefatos compilados
        uses: actions/download-artifact@v4

      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            */*.tar.gz
          draft: false
          prerelease: false
          generate_release_notes: true
