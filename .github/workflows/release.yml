name: Build and release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-package:
    name: Python package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Check release tag and project version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python -c "import os, pathlib, tomllib, rex; version = tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version']; expected = 'v' + version; actual = os.environ['RELEASE_TAG']; assert actual == expected and rex.__version__ == version, f'Version mismatch: tag={actual}, project={version}, module={rex.__version__}'"

      - name: Install build and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test]" build twine

      - name: Run tests and build distributions
        run: |
          python -m pytest -q
          python -m build
          python -m twine check dist/*

      - name: Smoke test wheel installation
        run: |
          python -m venv /tmp/rex-wheel-smoke
          /tmp/rex-wheel-smoke/bin/python -m pip install --only-binary=:all: dist/*.whl
          /tmp/rex-wheel-smoke/bin/rex --version
          /tmp/rex-wheel-smoke/bin/rex --help

      - uses: actions/upload-artifact@v4
        with:
          name: rex-python-dist
          path: dist/*
          if-no-files-found: error

  executables:
    name: Executable (${{ matrix.binary_name }})
    needs: python-package
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            binary_name: rex-windows-x64
            archive_name: rex-windows-x64.zip
          - os: ubuntu-latest
            binary_name: rex-linux-x64
            archive_name: rex-linux-x64.tar.gz
          - os: macos-15-intel
            binary_name: rex-macos-x64
            archive_name: rex-macos-x64.tar.gz
          - os: macos-latest
            binary_name: rex-macos-arm64
            archive_name: rex-macos-arm64.tar.gz

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Tk on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Install application and PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test]" pyinstaller

      - name: Test and bundle application
        run: |
          python -m pytest -q
          python -m PyInstaller --noconfirm --clean --onedir --console --name ${{ matrix.binary_name }} --collect-all rapidocr_onnxruntime --collect-all onnxruntime --collect-all customtkinter --collect-data rex --hidden-import rex.ui.desktop --hidden-import rex.ui.web rex/__main__.py

      - name: Smoke test and archive Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "dist/${{ matrix.binary_name }}/${{ matrix.binary_name }}.exe" --version
          & "dist/${{ matrix.binary_name }}/${{ matrix.binary_name }}.exe" --help
          Compress-Archive -Path "dist/${{ matrix.binary_name }}" -DestinationPath "${{ matrix.archive_name }}"

      - name: Smoke test and archive Unix executable
        if: runner.os != 'Windows'
        shell: bash
        run: |
          "dist/${{ matrix.binary_name }}/${{ matrix.binary_name }}" --version
          "dist/${{ matrix.binary_name }}/${{ matrix.binary_name }}" --help
          tar -czf "${{ matrix.archive_name }}" -C dist "${{ matrix.binary_name }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary_name }}
          path: ${{ matrix.archive_name }}
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [python-package, executables]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: rex-*
          path: release-assets
          merge-multiple: true

      - name: Generate SHA-256 checksums
        run: |
          cd release-assets
          sha256sum *.zip *.tar.gz *.whl > SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          fail_on_unmatched_files: true
          generate_release_notes: true
