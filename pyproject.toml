[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rex-eds"
version = "1.0.0"
authors = [
  { name = "Rodrigo Fernando Pinheiro Oliveira" }
]
description = "REX — MEV-EDS Report Extractor: Pipeline determinístico e inteligente para extração de laudos MEV-EDS."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["eds", "sem", "mev", "microscopy", "spectroscopy", "ocr", "rapidocr", "openxml"]
dependencies = [
  "rapidocr-onnxruntime>=1.2.0",
  "pillow>=10.0.0",
  "pandas>=2.0.0",
  "openpyxl>=3.1.0",
  "customtkinter>=5.2.0"
]

[project.optional-dependencies]
test = [
  "pytest>=8.0"
]

[project.scripts]
rex = "rex.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["rex*"]

[tool.setuptools.package-data]
"rex.ui" = ["web.html"]
